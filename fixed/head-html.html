    (F = confirmed failure, A = advisory recommendation) and the change-matrix row (C1-C18). */

/* ADA fix (best practice; advisory technique G201) - A2, A4 (C9): shared helper, text for assistive technology only
   (" (opens in a new window)" added to links by the script) */
.ada-sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }

/* ADA fix (best practice; WCAG 2.4.1) - A11 (C12): "Skip to main content" link, off screen until it receives keyboard focus */
.ada-skip { position: fixed; left: 8px; top: -120px; z-index: 2147483647; padding: 10px 16px; background: #0c4a08; color: #ffffff !important; font: 700 16px/1.2 Arial, Helvetica, sans-serif; text-decoration: underline; border-radius: 4px; }

  body:not(.dmMobileBody) #hamburger-header a[href^="tel:"] * { white-space: nowrap !important; font-size: 14px !important; }
  /* ADA fix (WCAG 1.4.3) - F8 (C1), review fix RF-7: once the columns are stacked, the home-page text "Reach Your Health
     Goals..." and its two paragraphs sit over the shelf photo, whose white overlay fades from left to right
     (".gradient-ltr", transparent from 75 % of the width), so words fell on dark bottles (about 12 % of the glyph-edge

  /* ADA fix (WCAG 1.4.10) - F8 (C1), battery fix V1: only the LARGE headings shrink to 28px. Headings whose Duda size
     class is 10-29px (block class size-1x / size-2x: footer "STORE", "RESTAURANT", "Company Info", "Links", the
     /thank-you message) and the headings of our menu widget (class ada-...) keep their own size, so nothing grows.
     :where() keeps the specificity of the rule unchanged (the .font-size-80 rule above still wins for the hero). */
  body:not(.dmMobileBody) .dmInner h1:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),
  body:not(.dmMobileBody) .dmInner h1:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])) *,
  body:not(.dmMobileBody) .dmInner h2:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),
  body:not(.dmMobileBody) .dmInner h2:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])) *,
  body:not(.dmMobileBody) .dmInner h3:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),
  body:not(.dmMobileBody) .dmInner h3:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])) * { font-size: 28px !important; line-height: 1.25 !important; }
  /* ADA fix (WCAG 1.4.10) - F8 (C1), battery fix 2 VR-1/VR-2: these 28px headings are all set in the theme font
     Caprasimo, which has no fallback in the theme ("font-family: Caprasimo"), so until the webfont arrives (~2 s) the

     Caprasimo loaded (home 0.041, /menu 0.007-0.010 at 320 px). The fallback below is Georgia scaled to Caprasimo's
     width (font-face further down), so the first paint already breaks the lines like Caprasimo. Only the heading
     element gets the stack, which its text inherits; text that names Caprasimo in its own inline style (the home hero

  body:not(.dmMobileBody) .dmInner h1:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),

  body:not(.dmMobileBody) .dmInner h2:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),

  body:not(.dmMobileBody) .dmInner h3:where(:not([class^="size-1"]):not([class*=" size-1"]):not([class^="size-2"]):not([class*=" size-2"]):not([class*="ada-"])),

/* ADA fix (WCAG 1.4.10; related 2.4.11) - F8 (C1), review fix RF-8 (ada-audit AA-1): in a short narrow window (for example
   320 x 256 CSS px = 400 % zoom of a 1280 x 1024 window) the fixed narrow-window header (phone number, "Daily Specials",
   menu button) took about half of the height (129 px of 256, because C1 lets its content wrap instead of overflowing).
   When the window is at most 400 px tall the header and its menu button scroll away with the page instead of staying
   fixed; at the top of the page nothing moves (same place, same size). The positioned wrapper of the header is made
   static so that both are placed from the top of the page. Wider or taller windows keep Duda's fixed header. */

  body:not(.dmMobileBody) #hamburger-header-container, body:not(.dmMobileBody) #site_content .layout-drawer-hamburger.hamburger-on-header { position: absolute !important; }
}

/* ADA fix (WCAG 1.4.10) - F8 (C1), v1.2.1 (manual checklist "Reflow and 400% zoom"): in the desktop layout at 320-480 CSS px
   (desktop browsers zoomed to 300-400 %) Duda's drawer menu was 49vw wide (157 px at 320 px, 176 px at 360 px) with 40 px

   16 px side padding, and the labels wrap inside it. Wider windows and the phone layout keep Duda's drawer. */
@media (max-width: 480px) {
  body:not(.dmMobileBody) #dm .p_hfcontainer #hamburger-drawer.layout-drawer:not([data-origin="top"]),
  body:not(.dmMobileBody) #hamburger-drawer.layout-drawer { width: min(100vw, 320px) !important; max-width: 100vw !important; }
  body:not(.dmMobileBody) #dm .p_hfcontainer #hamburger-drawer .dmRespRow,

  body:not(.dmMobileBody) #dm .p_hfcontainer #hamburger-drawer nav.main-navigation.unifiednav,
  body:not(.dmMobileBody) #hamburger-drawer nav.unifiednav { min-width: 0 !important; width: 100% !important; max-width: 100% !important; }
  body:not(.dmMobileBody) #hamburger-drawer .unifiednav__container,
  body:not(.dmMobileBody) #hamburger-drawer .unifiednav__item-wrap,
  body:not(.dmMobileBody) #dm .p_hfcontainer #hamburger-drawer .unifiednav__item-wrap > a.unifiednav__item,

  body:not(.dmMobileBody) #hamburger-drawer a.unifiednav__item,
  body:not(.dmMobileBody) #hamburger-drawer a.unifiednav__item * { white-space: normal !important; overflow-wrap: anywhere !important; }
}

/* ADA fix (WCAG 2.4.11) - C18 (v1.2.1, manual checklist "Focus not obscured"): scroll padding at the top of the page
   equal to the fixed header + 8 px, so that a control focused with Shift+Tab (or reached by an anchor) is scrolled
   below the header instead of behind it. --ada-header-h is the header's real height, measured by the script on load,
   scroll and resize (Duda's desktop header shrinks to 45 px when the page scrolls; RF-8 lets the narrow header scroll
   away in short windows, 0 px). Fallback values when the script cannot run: 45 px desktop menu bar, 129 px narrow
   desktop window (86 px at 1024 px, up to 129 px at 390 px), 63 px phone header. */
html { --ada-header-fallback: 45px; scroll-padding-top: calc(var(--ada-header-h, var(--ada-header-fallback)) + 8px) !important; }
@media (max-width: 1024px) { html { --ada-header-fallback: 129px; } }
@media (max-width: 767px) and (max-height: 400px) { html { --ada-header-fallback: 0px; } }
html:has(> body.dmMobileBody) { --ada-header-fallback: 63px; }

/* ADA fix (WCAG 1.4.10) - F8 (C1), battery fix 2 VR-1/VR-2: metric-matched fallback for Caprasimo, used only by the rule
   above (narrow desktop layout). Local Georgia, no download; size-adjust 114.3% = mean width ratio Caprasimo / Georgia
   over the 42 heading texts of the site (spread 1.098-1.176, the closest of 8 system fonts); ascent/descent as
   Caprasimo (0.92 / 0.23 em). If Georgia is missing the stack ends at the browser's default font, as before. */
@font-face { font-family: "ADA Caprasimo Fallback"; src: local("Georgia"), local("Georgia Regular"); font-weight: 400; font-style: normal; size-adjust: 114.3%; ascent-override: 80.5%; descent-override: 20.1%; line-gap-override: 0%; }

/* ADA fix (WCAG 2.5.8) - A1 (C5), battery fix N2: the top-level links of the desktop menu bar were 21px tall. Their
   box grows to 24px and the negative margins give the space back, so the bar, the text and the submenus do not move;
   every top-level target is now at least 24 x 24 CSS px (no spacing exception needed). (the selectors outrank Duda's own
   "#dm .p_hfcontainer .u_ID.main-navigation ... { margin: 0 !important }" rule of the menu items.) */
body #dm .p_hfcontainer nav.main-navigation.unifiednav[data-ada-nav="menubar"] .unifiednav__container:not(.unifiednav__container_sub-nav) > .unifiednav__item-wrap > a.unifiednav__item,
body #dm nav.main-navigation.unifiednav[data-ada-nav="menubar"] .unifiednav__container:not(.unifiednav__container_sub-nav) > .unifiednav__item-wrap > a.unifiednav__item,
[data-ada-nav="menubar"] .unifiednav__container:not(.unifiednav__container_sub-nav) > .unifiednav__item-wrap > a.unifiednav__item { box-sizing: border-box !important; min-height: 24px !important; margin-top: -1.5px !important; margin-bottom: -1.5px !important; }

/* ADA fix (WCAG 1.4.11) - F6 (C2): form field borders at least 3:1 against the page and the field fill
   (#3D7A37; it was #B8D9B3, 1.30-1.51:1) */
/* (selectors carry #dm and body to outrank Duda's own "!important" widget rule: #dm .p_hfcontainer div.u_... input) */
body #dm .dmform .dmforminput input:not([type="submit"]):not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),
body #dm .dmform .dmforminput textarea:not(.g-recaptcha-response),
body #dm .dmform .dmforminput select { border-color: #3D7A37 !important; }

/* ADA fix (WCAG 1.4.11) - F7 (C3): phone-header menu button lines and call icon at least 3:1 on white
   (#3D7A37; they were #65C057, 2.27:1) */
.layout-drawer-hamburger .hamburger__slice { background-color: #3D7A37 !important; border-color: #3D7A37 !important; }
.hamburger-header a[href^="tel:"] svg, .hamburger-header a[href^="tel:"] svg *, a[href^="tel:"][data-ada-call] svg, a[href^="tel:"][data-ada-call] svg * { fill: #3D7A37 !important; }

/* ADA fix (WCAG 2.4.11) - F9 (C4): the fixed reCAPTCHA badge covered the last footer link when focused; it is hidden
   (visibility, as Google allows) and Google's notice is shown under each form (added by the script) */
.grecaptcha-badge { visibility: hidden !important; }
.ada-recaptcha-note { margin: 8px 0 0 !important; font-size: 13px !important; line-height: 1.4 !important; color: #1a1a1a !important; text-align: left !important; }
.ada-recaptcha-note a { color: #0c4a08 !important; text-decoration: underline !important; }

/* ADA fix (WCAG 4.1.2 related; best practice) - A1 (C5): collapsed submenus are hidden from assistive technology
   (Duda only made them transparent, so screen readers read all their links). Header menu bar: a submenu is shown while
   it is open from the keyboard/click (ada-open, set by the script) or hovered; phone drawer: while it is expanded. */
[data-ada-nav="menubar"] .unifiednav__item-wrap > .unifiednav__container_sub-nav { visibility: hidden !important; }
[data-ada-nav="menubar"] .unifiednav__item-wrap.ada-open > .unifiednav__container_sub-nav,
[data-ada-nav="menubar"] .unifiednav__item-wrap:hover:not(.ada-dismissed) > .unifiednav__container_sub-nav { visibility: visible !important; }
[data-ada-nav="disclosure"] .unifiednav__item-wrap:not(.ada-open) > .unifiednav__container_sub-nav { visibility: hidden !important; }
/* ADA fix (WCAG 1.3.1 related; best practice) - A1 (C5), review fix RF-5: the closed menu drawer (aria-hidden, inert and
   off screen) is also visibility:hidden once its closing slide has finished (class set by the script) */
.layout-drawer.ada-drawer-closed, .hamburger-drawer.ada-drawer-closed { visibility: hidden !important; }

/* ADA fix (WCAG 1.4.13) - F1 (C5): a submenu dismissed with Escape stays closed until the pointer leaves it */
[data-ada-nav] .unifiednav__item-wrap.ada-dismissed > .unifiednav__container_sub-nav { visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }

/* ADA fix (WCAG 3.3.2) - F4, A13 (C6): visible labels above the contact-form fields (the placeholders disappeared
   while typing) and a visible "*" on required fields (Duda's own marker, darker for contrast); the script adds
   aria-required and the "* indicates a required field" instruction. */
body #dm div.dmInner .dmform .dmforminput > label[hide="true"], .dmform .dmforminput > label[hide="true"] { display: block !important; position: static !important; visibility: visible !important; width: auto !important; height: auto !important; clip: auto !important; overflow: visible !important; margin: 0 0 4px !important; padding: 0 !important; font-size: 15px !important; line-height: 1.3 !important; color: #1a1a1a !important; text-align: left !important; }
.dmform .dmforminput.required > label::after { content: "*"; display: inline-block; margin-inline-start: 4px; color: #a30000 !important; font-weight: 700; }
.ada-form-note { margin: 0 0 8px !important; font-size: 15px !important; line-height: 1.3 !important; color: #1a1a1a !important; text-align: left !important; }

/* ADA fix (WCAG 1.4.3) - FM-14 (C8; found by the test battery, not in Exhibit B): the messages Duda shows after the
   form is sent ("Oops, there was an error sending your message..." and the inline "Thank you for contacting us.")
   were #F7F7F7 on the white form panel (1.03-1.08:1). Dark text #1D1D1B: about 16:1 on that panel. */
body #dm .dmform .dmform-error, body #dm .dmform .dmform-error *, body #dm .dmform .dmform-success, body #dm .dmform .dmform-success *,

   desktop menu bar background #0c7600 -> #085500. White labels go from 5.82:1 to 9.1:1 and the current-page label
   (#e7ede4) from 4.88:1 to 7.6:1. Duda row u_1425559235 = the green bar of the desktop header (global section); the
   selected submenu item uses the same green. Visible change: a darker brand green in the desktop menu bar. */
body:not(.dmMobileBody) #dm .dmRespRow.u_1425559235 { background-color: #085500 !important; }
body:not(.dmMobileBody) #dm nav[data-ada-nav="menubar"] a.dmNavItemSelected { background-color: #085500 !important; }

/* ADA fix (WCAG 1.4.6, AAA) - client directive 100 (v1.2.0; EqualWeb EW-2): the "Download the menu (PDF, 2 pages)" link
   of our menu section (Duda editor change ED5) #0C6937 (6.79:1) -> #0A5A2F (8.4:1 on white). The rest of the menu section keeps the printed
   menu's green. */
#ada-menu .ada-menu-download a { color: #0A5A2F !important; }

/* ADA fix (WCAG 2.4.11, 2.5.8, 4.1.2 of the embedded map; best practice) - C15 (v1.2.0): the /contact-us Google map loads
   on request. Before that, the map widget shows the address, the "Show interactive map (Google Maps)" button and the
   "Open in Google Maps" link (built by the script) inside the widget's own box (636 px desktop, 250 px phone), so
   nothing moves on load. When the visitor shows the map, Google's iframe gets the box's height and the link stays
   under it (the widget grows by the link's line, a change the visitor asked for).
   v1.2.1 (WCAG 1.4.4, 1.4.12; manual checklist advisory): the box's height is a MINIMUM height (the widget's own height,
   measured by the script) and the widget grows with its content, so enlarged text no longer overflows onto the photo.
   Colors: text #1a1a1a and #0c4a08 on white (17:1, 10.6:1), button white on #0c4a08 (10.6:1), focus outlines #0c4a08
   (10.6:1 against white). Targets at least 44 px tall. */
.ada-map { box-sizing: border-box !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 12px !important; width: 100% !important; height: auto !important; min-height: 100% !important; overflow: visible !important; margin: 0 !important; padding: 16px !important; background: #ffffff !important; border: 1px solid #3D7A37 !important; text-align: center !important; color: #1a1a1a !important; font: 400 16px/1.5 Arial, Helvetica, sans-serif !important; }
.ada-map[data-ada-map="loaded"] { height: auto !important; min-height: 0 !important; justify-content: flex-start !important; gap: 4px !important; padding: 0 !important; border: 0 !important; }
.ada-map[data-ada-map="loaded"] > iframe { display: block !important; flex: 0 0 auto !important; width: 100% !important; border: 0 !important; }
.ada-map:focus { outline: 3px solid #0c4a08 !important; outline-offset: 2px !important; }
.ada-map .ada-map-address { margin: 0 !important; padding: 0 !important; color: #1a1a1a !important; font: inherit !important; }
.ada-map .ada-map-show { display: inline-block !important; min-height: 44px !important; margin: 0 !important; padding: 10px 20px !important; border: 2px solid #0c4a08 !important; border-radius: 4px !important; background: #0c4a08 !important; color: #ffffff !important; font: 700 16px/1.25 Arial, Helvetica, sans-serif !important; cursor: pointer !important; }
.ada-map .ada-map-show:hover { background: #ffffff !important; color: #0c4a08 !important; }
.ada-map .ada-map-show:focus-visible { outline: 3px solid #0c4a08 !important; outline-offset: 3px !important; }
.ada-map .ada-map-open { display: inline-block !important; min-height: 24px !important; padding: 10px 4px !important; color: #0c4a08 !important; font: inherit !important; text-decoration: underline !important; }
.ada-map .ada-map-open:focus-visible { outline: 3px solid #0c4a08 !important; outline-offset: 2px !important; }

  // ---------------------------------------------------------------- C18: focus not obscured by the fixed header
