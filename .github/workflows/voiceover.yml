name: VoiceOver transcripts (anthonyshealthhutlakeland.com)

on:
  workflow_dispatch:
    inputs:
      read_scale:
        description: "Multiplier for the linear read-through length (1 = default per page)"
        default: "1"
        required: false
      target:
        description: "baseline = published site; retest = corrected staging copy served on the runner"
        default: "retest"
        required: false
      jobs:
        description: "all, or a comma-separated list of browser-page jobs to run (e.g. webkit-home,chromium-home)"
        default: "all"
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          WANT: ${{ inputs.jobs || 'all' }}
        run: |
          all='[{"browser":"webkit","page":"home"},{"browser":"webkit","page":"about-us"},{"browser":"webkit","page":"contact-us"},{"browser":"webkit","page":"menu"},{"browser":"webkit","page":"vitamins-and-minerals"},{"browser":"chromium","page":"home"}]'
          m=$(echo "$all" | jq -c --arg w "$WANT" 'if $w == "all" then . else map(select(. as $j | ("," + $w + ",") | contains("," + $j.browser + "-" + $j.page + ","))) end')
          echo "matrix=$m" >> "$GITHUB_OUTPUT"; echo "$m"

  voiceover:
    needs: plan
    name: VoiceOver / ${{ matrix.browser }} / ${{ matrix.page }}
    runs-on: macos-15
    # Full read-through + form-submission scenario: Playwright test timeout 75 min (playwright.config.ts), job 90 min.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One macOS runner per page so the templates run in parallel (VoiceOver allows one session per machine).
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VO_PAGES: ${{ matrix.page }}
      VO_READ_SCALE: ${{ inputs.read_scale }}
      RUNNER_OS_LABEL: macos-15
      VO_ORIGIN: ${{ inputs.target == 'baseline' && 'https://www.anthonyshealthhutlakeland.com' || 'http://localhost:4173' }}
      VO_PACKAGE: v1.2.1
      VO_EXPECTED_HEAD_SHA: 8767b7871edcaa4792311dc71b90b00b3463cec90ee947834ca6b899e92ec70d
      VO_STAGING_MODE: offline snapshot (fixed/staging/cache, captured 2026-10-12/13; no request to the live site)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Accessibility permissions in the user TCC.db, AppleScript control of VoiceOver, welcome dialog suppressed.
      - name: Prepare macOS for VoiceOver automation
        run: npx -y @guidepup/setup@0.29.1 setup --ci

      # The runner image maps the bottom-right hot corner to Quick Note: when VoiceOver's cursor (and the mouse that follows
      # it) reached an item in that corner, macOS opened a "Quick Note" dialog and the read-through stopped there
      # (home, run 38901941854). Hot corners are switched off on the runner VM only.
      - name: Disable macOS hot corners (Quick Note)
        run: |
          for c in tl tr bl br; do defaults write com.apple.dock "wvous-$c-corner" -int 1; defaults write com.apple.dock "wvous-$c-modifier" -int 0; done
          killall Dock || true
          defaults read com.apple.dock | grep wvous || true

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund --no-progress

      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}

      - name: Install Guidepup VoiceOver assets
        run: npx -y @guidepup/setup@0.29.1 install

      - name: Verify the fix package (Head HTML SHA-256)
        if: inputs.target != 'baseline'
        run: |
          sha=$(shasum -a 256 fixed/head-html.html | cut -d' ' -f1)
          echo "head-html.html SHA-256 $sha (expected $VO_EXPECTED_HEAD_SHA)"
          test "$sha" = "$VO_EXPECTED_HEAD_SHA"
          echo "VO_HEAD_SHA=$sha" >> "$GITHUB_ENV"
          shasum -a 256 fixed/editor/editor-sim.mjs fixed/staging/server.mjs fixed/menu/*

      - name: Start the corrected staging copy (snapshot of the published pages + fix package, offline)
        if: inputs.target != 'baseline'
        run: |
          nohup node fixed/staging/server.mjs --offline > staging.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/__staging/health && break; sleep 2; done
          curl -fsS -o /dev/null -w "page %{http_code} " http://localhost:4173/
          curl -fsS -A "Mozilla/5.0 (Macintosh)" http://localhost:4173/menu | grep -c "Restaurant Menu" || true

      - name: Run the real VoiceOver session and write the transcript
        run: npx playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceover-${{ matrix.browser }}-${{ matrix.page }}
          if-no-files-found: warn
          path: |
            transcripts/**
            test-results/**
            playwright-report/**
            staging.log
            fixed/staging/logs/**
